services:
  postgres:
    image: postgres:16
    container_name: logiq-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logiq

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: logiq-redis
    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: